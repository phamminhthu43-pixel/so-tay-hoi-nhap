<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1036">
<title>Sổ tay hội nhập – Quang Nhung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b1036; --bg2: #16206b; --navy: #2234b8; --pink: #ff3d7f; --pink2: #ff7aa8;
    --glass: rgba(255,255,255,.07); --line: rgba(255,255,255,.12);
    --text: #f3f5ff; --muted: #aab3e0; --top: 58px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); overflow: hidden;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 80% -10%, #2a2f8f 0%, transparent 60%),
                radial-gradient(900px 600px at -10% 110%, #5a1a5e 0%, transparent 55%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* Đốm màu chuyển động phía sau */
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45; pointer-events: none; z-index: 0; }
  .blob.a { width: 380px; height: 380px; background: var(--pink); top: -120px; left: -80px; animation: float 14s ease-in-out infinite; }
  .blob.b { width: 460px; height: 460px; background: #3b4dff; bottom: -160px; right: -120px; animation: float 18s ease-in-out infinite reverse; }
  @keyframes float { 50% { transform: translate(60px, 40px) scale(1.1); } }

  /* ---------- Màn hình nhập mã ---------- */
  .lock { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; padding: 16px; }
  .lock-card {
    width: 100%; max-width: 420px; padding: 34px 26px 26px; border-radius: 24px; text-align: center;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: rise .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(145deg, #3347e0, var(--navy)); font-weight: 800; font-size: 26px; letter-spacing: -1px;
    box-shadow: 0 6px 0 var(--pink), 0 16px 40px rgba(51,71,224,.5); animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .lock-card h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .lock-card h1 span { background: linear-gradient(90deg, var(--pink), var(--pink2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lock-card p { margin: 10px 0 24px; color: var(--muted); line-height: 1.55; font-size: 15px; }
  .field { position: relative; }
  .field input {
    width: 100%; padding: 16px 18px; font: 600 20px/1 "Be Vietnam Pro", sans-serif; letter-spacing: 3px; text-align: center;
    text-transform: uppercase; color: #fff; background: rgba(0,0,0,.25); border: 2px solid var(--line); border-radius: 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: #6d76a8; letter-spacing: 1px; font-weight: 500; font-size: 16px; }
  .field input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,61,127,.2); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .cta {
    width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 14px; font-weight: 700; font-size: 16px;
    background: linear-gradient(90deg, var(--pink), #ff6a5a); box-shadow: 0 10px 30px rgba(255,61,127,.35);
    transition: transform .15s, opacity .2s;
  }
  .cta:active { transform: scale(.98); }
  .cta:disabled { opacity: .6; }
  .msg { min-height: 20px; margin-top: 14px; font-size: 14px; color: #ff9db8; }
  .msg.ok { color: var(--muted); }
  .values { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 22px; }
  .values span { font-size: 11px; padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

  /* ---------- Trình xem sổ tay ---------- */
  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; animation: rise .6s; }
  .topbar {
    height: var(--top); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: rgba(8,12,45,.6); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); position: relative;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; white-space: nowrap; }
  .brand .mini { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; display: grid; place-items: center; font-weight: 800; background: var(--navy); box-shadow: 0 3px 0 var(--pink); }
  .brand small { color: var(--muted); font-weight: 500; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 0 6px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); transition: all .2s; }
  .chip:hover { color: #fff; }
  .chip.on { background: linear-gradient(90deg, var(--navy), #3d50ff); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(61,80,255,.45); }
  .tools { display: flex; align-items: center; gap: 4px; }
  .ico { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; transition: background .2s; }
  .ico:hover { background: rgba(255,255,255,.14); }
  .ico svg { width: 18px; height: 18px; }
  .count { font-size: 13px; color: var(--muted); min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
  .progress { position: absolute; left: 0; bottom: -1px; height: 3px; background: linear-gradient(90deg, var(--pink), #ffb36b); border-radius: 0 3px 3px 0; transition: width .4s cubic-bezier(.2,.8,.2,1); }

  .stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 18px 70px 8px; }
  .slide { height: 100%; display: flex; align-items: center; justify-content: center; }
  .slide img {
    max-height: calc(100vh - var(--top) - 120px); max-width: 100%; border-radius: 14px; background: #fff; cursor: zoom-in;
    box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  }
  .slide.in { animation: slideIn .45s cubic-bezier(.2,.8,.2,1); }
  .slide.back { animation: slideBack .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px) scale(.98); } }
  @keyframes slideBack { from { opacity: 0; transform: translateX(-40px) scale(.98); } }
  .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--pink); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.08); backdrop-filter: blur(8px); display: grid; place-items: center; transition: all .2s; }
  .nav:hover { background: var(--pink); border-color: var(--pink); }
  .nav:disabled { opacity: .25; pointer-events: none; }
  .nav.prev { left: 14px; } .nav.next { right: 14px; }
  .nav svg { width: 22px; height: 22px; }

  .caption { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 16px 16px; text-align: left; }
  .caption .tag { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; padding: 5px 10px; border-radius: 8px; background: rgba(255,61,127,.16); color: var(--pink2); }
  .caption .t { font-weight: 700; font-size: 15px; }
  .caption .tip { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .caption.pop > div { animation: rise .5s; }

  /* Mục lục */
  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(6,9,35,.82); backdrop-filter: blur(14px); overflow-y: auto; padding: 22px 16px 40px; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .overlay-head { max-width: 1100px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: space-between; }
  .overlay-head h2 { margin: 0; font-size: 22px; }
  .overlay-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .thumb { position: relative; text-align: left; padding: 0; border: 0; background: none; transition: transform .2s; }
  .thumb:hover { transform: translateY(-4px); }
  .thumb .img { aspect-ratio: 1 / 1.414; border-radius: 10px; background: rgba(255,255,255,.06) center top / cover no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 2px solid transparent; }
  .thumb.cur .img { border-color: var(--pink); }
  .thumb .n { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .thumb .nm { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .thumb .seen { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: #22c55e; display: grid; place-items: center; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }

  /* Phóng to */
  .zoom { position: fixed; inset: 0; z-index: 11; background: rgba(4,6,25,.95); overflow: auto; cursor: zoom-out; animation: fade .2s; }
  .zoom img { display: block; width: min(100%, 1100px); margin: 0 auto; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 12; padding: 12px 18px; border-radius: 12px; background: #fff; color: #1b2160; font-weight: 600; font-size: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); animation: rise .4s; }
  .heart { position: fixed; top: -30px; z-index: 13; pointer-events: none; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .2; } }

  /* ---------- Hiệu ứng chuyển động ---------- */
  /* Các mục hiện lần lượt: gán --i cho từng mục để lệch thời gian */
  .stagger > * { animation: popUp .55s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i, 0) * 70ms + var(--d, 0ms)); }
  @keyframes popUp { from { opacity: 0; transform: translateY(14px) scale(.9); } }
  .values > span:hover { border-color: var(--pink); color: #fff; transform: translateY(-2px); transition: all .2s; }
  .app .topbar { animation: dropIn .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-100%); } }
  /* Trang mở ra từ trên xuống, kèm vệt sáng lướt qua */
  .slide .card { position: relative; display: inline-block; max-height: 100%; border-radius: 14px; overflow: hidden; }
  .slide .card img { display: block; }
  .slide.in .card, .slide.back .card { animation: reveal .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes reveal { from { clip-path: inset(0 0 100% 0 round 14px); transform: scale(1.04); } to { clip-path: inset(0 0 0 0 round 14px); } }
  .slide .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform: translateX(-120%); animation: shine 1.3s .6s ease-out both;
  }
  @keyframes shine { to { transform: translateX(120%); } }
  .count.bump { animation: bump .4s; }
  @keyframes bump { 40% { transform: scale(1.35); color: #fff; } }
  .caption .t { animation: slideUp .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } }
  .tips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tips span {
    font-size: 13px; line-height: 1.4; color: #e6e9ff; padding: 4px 10px; border-radius: 12px;
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
  }
  .tips span:first-child { border-color: rgba(255,61,127,.5); }
  .grid.stagger > * { animation-name: thumbIn; }
  @keyframes thumbIn { from { opacity: 0; transform: translateY(24px) rotate(-2deg) scale(.92); } }
  .nav { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,61,127,.0), 0 0 22px rgba(255,61,127,.35); } }
  .mnav .ico.next { animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Trang làm bằng web (có chuyển động bên trong) */
  .slide .webpage { position: relative; width: min(1040px, 100%); max-height: calc(100vh - var(--top) - 120px); overflow-y: auto; border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,.45); scrollbar-width: thin; }
  .slide.in .webpage, .slide.back .webpage { animation: reveal .8s cubic-bezier(.2,.8,.2,1) both; }
  .slide .wrapv { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; height: 100%; justify-content: center; }
  .wrapv .webpage, .wrapv .card img { max-height: calc(100vh - var(--top) - 170px); }
  .switch { flex: none; display: inline-flex; padding: 3px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }
  .switch button { border: 0; background: none; padding: 6px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .switch button.on { background: #fff; color: #1b2160; }

  .mnav { display: none; }
  .mnav .ico { width: 40px; height: 40px; }
  .mnav .ico.next { background: var(--pink); border-color: var(--pink); }
  .mnav .ico:disabled { opacity: .3; }

  /* Điện thoại: ảnh rộng hết khung, cuộn dọc trong trang, vuốt ngang để chuyển */
  @media (max-width: 760px) {
    :root { --top: 54px; }
    .brand small, .nav { display: none; }
    .chips { order: 3; position: absolute; left: 0; right: 0; top: var(--top); padding: 8px 12px; background: rgba(8,12,45,.6); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .topbar { justify-content: space-between; }
    .stage { padding: 58px 0 0; display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .slide { height: auto; display: block; padding: 10px 12px 12px; }
    .slide .card { display: block; border-radius: 12px; }
    .slide .webpage { max-height: none; overflow: visible; border-radius: 14px; }
    .slide .wrapv { display: block; text-align: center; }
    .wrapv .webpage, .wrapv .card img { max-height: none; }
    .slide .wrapv .switch { margin-bottom: 10px; }
    .slide .wrapv > :not(.switch) { text-align: left; }
    .slide img { width: 100%; max-height: none; border-radius: 12px; cursor: default; }
    .caption { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(8,12,45,.75); backdrop-filter: blur(14px); border-top: 1px solid var(--line); justify-content: space-between; }
    .caption .tag { display: none; }
    .caption > div:nth-child(2) { min-width: 0; }
    .tips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .tips::-webkit-scrollbar { display: none; }
    .tips span { flex: none; font-size: 12px; white-space: nowrap; }
    .tips span:only-child { white-space: normal; flex: 1; }
    .mnav { display: flex !important; gap: 8px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<!-- Màn hình nhập mã -->
<section class="lock" id="lock">
  <form class="lock-card" id="form">
    <div class="logo">QN</div>
    <h1>Sổ tay <span>hội nhập</span></h1>
    <p>Chào mừng Anh/Chị đến với đại gia đình Quang Nhung!<br>Nhập <b>mã nhân viên</b> để bắt đầu hành trình.</p>
    <div class="field"><input id="code" placeholder="Ví dụ: S0123" autocomplete="off" autocapitalize="characters" spellcheck="false" required></div>
    <button class="cta" id="go" type="submit">Mở sổ tay →</button>
    <div class="msg" id="msg"></div>
    <div class="values stagger" style="--d: 450ms"><span>Trách nhiệm</span><span>Kỷ luật</span><span>Cải tiến</span><span>Biết ơn</span><span>Tích cực</span><span>Đoàn kết</span><span>Uy tín</span></div>
  </form>
</section>

<!-- Trình xem -->
<section class="app hidden" id="app">
  <div class="topbar">
    <div class="brand"><span class="mini">QN</span>Quang Nhung <small>· Sổ tay hội nhập</small></div>
    <nav class="chips stagger" id="chips" style="--d: 250ms"></nav>
    <div class="tools">
      <span class="count" id="count"></span>
      <button class="ico" id="menu" type="button" title="Mục lục" aria-label="Mục lục"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button class="ico" id="dl" type="button" title="Tải file PDF" aria-label="Tải file PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg></button>
      <button class="ico" id="logout" type="button" title="Thoát" aria-label="Thoát"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></button>
    </div>
    <div class="progress" id="bar"></div>
  </div>

  <div class="stage" id="stage">
    <button class="nav prev" id="prev" type="button" aria-label="Trang trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="slide" id="slide"><div class="spinner"></div></div>
    <button class="nav next" id="next" type="button" aria-label="Trang sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="caption" id="caption">
    <span class="tag" id="ctag"></span>
    <div><div class="t" id="ctitle"></div><div class="tips stagger" id="ctip" style="--d: 200ms"></div></div>
    <div class="mnav">
      <button class="ico" id="mprev" type="button" aria-label="Trang trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ico next" id="mnext" type="button" aria-label="Trang sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</section>

<div class="overlay hidden" id="overlay">
  <div class="overlay-head">
    <div><h2>Mục lục</h2><p id="seenInfo"></p></div>
    <button class="ico" id="closeMenu" type="button" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="grid stagger" id="grid"></div>
</div>

<div class="zoom hidden" id="zoom"><img id="zoomImg" alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const normalize = (s) => s.replace(/\s+/g, '').toUpperCase();
const STORE = 'qn-so-tay-ma', SEEN = 'qn-so-tay-da-xem';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let cfg, master, meta, cur = 1, seen = new Set();
const urls = {};

async function open(blob, key) {
  const buf = new Uint8Array(blob);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}

async function unlock(code) {
  if (!cfg) cfg = await (await fetch('data/config.json', { cache: 'no-store' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(cfg.salt), iterations: cfg.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const k of cfg.keys) {
    try {
      const raw = await open(b64(k), kek);
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    } catch (e) { /* không khớp, thử khoá tiếp theo */ }
  }
  return null;
}

async function fetchPlain(name) {
  const res = await fetch('data/' + name, { cache: 'no-store' });
  return open(await res.arrayBuffer(), master);
}

function pageUrl(i) {
  if (!urls[i]) {
    urls[i] = fetchPlain('p' + String(i).padStart(2, '0') + '.bin')
      .then((d) => URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })));
  }
  return urls[i];
}

// Đánh số thứ tự để các mục hiện lần lượt
const numberKids = (el) => [...el.children].forEach((c, k) => c.style.setProperty('--i', k));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
document.querySelectorAll('.stagger').forEach(numberKids);

const chapterOf = (i) => meta.chapters.filter((c) => c.from <= i).pop();

function buildChips() {
  $('chips').innerHTML = '';
  meta.chapters.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = c.name;
    b.onclick = () => go(c.from);
    $('chips').appendChild(b);
  });
  numberKids($('chips'));
}

async function go(i, dir) {
  if (i < 1 || i > cfg.pages) return;
  dir = dir || (i >= cur ? 'in' : 'back');
  cur = i;
  history.replaceState(null, '', '#trang-' + i);
  seen.add(i);
  store.set(SEEN, JSON.stringify([...seen]));

  const ch = chapterOf(i), p = meta.pages[i - 1];
  $('count').textContent = i + ' / ' + cfg.pages;
  replay($('count'), 'bump');
  $('bar').style.width = (i / cfg.pages * 100) + '%';
  $('prev').disabled = $('mprev').disabled = i === 1;
  $('next').disabled = $('mnext').disabled = i === cfg.pages;
  [...$('chips').children].forEach((b, k) => {
    const on = meta.chapters[k] === ch;
    b.classList.toggle('on', on);
    if (on) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });
  $('ctag').textContent = ch.name;
  const t = $('ctitle');
  t.textContent = p.title;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  // Mỗi ý trong câu tóm tắt thành một nhãn nhỏ, hiện lần lượt
  const tips = $('ctip');
  tips.innerHTML = '';
  p.tip.split(' · ').forEach((s) => {
    const span = document.createElement('span');
    span.textContent = s;
    tips.appendChild(span);
  });
  numberKids(tips);

  await renderSlide(i, dir);
  if (i + 1 <= cfg.pages) pageUrl(i + 1);
  if (i === cfg.pages) celebrate();
}

// Trang có bản web thì mặc định hiện bản động, có nút chuyển sang ảnh gốc
const showOriginal = {};
const webHtml = {};

async function renderSlide(i, dir) {
  const slide = $('slide'), p = meta.pages[i - 1];
  slide.innerHTML = '<div class="spinner"></div>';
  let content;
  if (p.web && !showOriginal[i]) {
    if (!webHtml[i]) webHtml[i] = new TextDecoder().decode(await fetchPlain(p.web));
    content = document.createElement('div');
    content.className = 'webpage';
    content.innerHTML = webHtml[i];
  } else {
    const src = await pageUrl(i);
    const img = new Image();
    img.src = src;
    img.alt = p.title;
    img.onclick = () => { if (innerWidth > 760) { $('zoomImg').src = src; $('zoom').classList.remove('hidden'); } };
    content = document.createElement('div');
    content.className = 'card';
    content.appendChild(img);
  }
  if (cur !== i) return;
  slide.innerHTML = '';
  if (p.web) {
    const wrap = document.createElement('div');
    wrap.className = 'wrapv';
    const sw = document.createElement('div');
    sw.className = 'switch';
    sw.innerHTML = '<button type="button">✨ Bản động</button><button type="button">🖼 Bản gốc</button>';
    sw.children[showOriginal[i] ? 1 : 0].classList.add('on');
    sw.children[0].onclick = () => { showOriginal[i] = false; renderSlide(i, 'in'); };
    sw.children[1].onclick = () => { showOriginal[i] = true; renderSlide(i, 'in'); };
    wrap.append(sw, content);
    slide.appendChild(wrap);
  } else {
    slide.appendChild(content);
  }
  slide.className = 'slide';
  void slide.offsetWidth;
  slide.className = 'slide ' + dir;
  $('stage').scrollTop = 0;
}

// Thẻ lật trong trang web: chạm để lật, lật đủ hết thì chúc mừng
document.addEventListener('click', (e) => {
  const fc = e.target.closest('[data-flip]');
  if (!fc) return;
  fc.classList.toggle('flipped');
  fc.dataset.seen = '1';
  const box = fc.closest('[data-explore]');
  if (!box) return;
  const all = box.querySelectorAll('[data-flip]');
  const done = box.querySelectorAll('[data-flip][data-seen]').length;
  box.querySelectorAll('[data-dots] i').forEach((d, k) => d.classList.toggle('on', k < done));
  const msg = box.querySelector('[data-done]');
  if (msg && done === all.length && !box.dataset.cheered) {
    box.dataset.cheered = '1';
    setTimeout(() => msg.classList.add('show'), 700);
    setTimeout(() => msg.classList.remove('show'), 3500);
  }
});

function celebrate() {
  if (store.get('qn-so-tay-xong')) return;
  store.set('qn-so-tay-xong', '1');
  const icons = ['💗', '💙', '✨', '🎉'];
  for (let k = 0; k < 36; k++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = icons[k % icons.length];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    h.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }
  toast('🎉 Chúc mừng Anh/Chị đã đọc hết Sổ tay hội nhập!');
}

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

async function openMenu() {
  $('overlay').classList.remove('hidden');
  $('seenInfo').textContent = 'Anh/Chị đã xem ' + seen.size + ' / ' + cfg.pages + ' trang';
  const grid = $('grid');
  grid.innerHTML = '';
  meta.pages.forEach((p, k) => {
    const i = k + 1;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'thumb' + (i === cur ? ' cur' : '');
    b.innerHTML = '<div class="img"></div><div class="n">Trang ' + i + ' · ' + chapterOf(i).name + '</div><div class="nm"></div>' + (seen.has(i) ? '<span class="seen">✓</span>' : '');
    b.querySelector('.nm').textContent = p.title;
    b.onclick = () => { $('overlay').classList.add('hidden'); go(i); };
    b.style.setProperty('--i', k);
    grid.appendChild(b);
    pageUrl(i).then((u) => { b.querySelector('.img').style.backgroundImage = 'url(' + u + ')'; });
  });
}

async function startApp() {
  meta = JSON.parse(new TextDecoder().decode(await fetchPlain('noi-dung.bin')));
  try { seen = new Set(JSON.parse(store.get(SEEN) || '[]')); } catch (e) {}
  buildChips();
  $('lock').classList.add('hidden');
  $('app').classList.remove('hidden');
  const m = location.hash.match(/trang-(\d+)/);
  go(m ? Math.min(+m[1], cfg.pages) : 1, 'in');
}

async function tryCode(code, remember) {
  $('go').disabled = true;
  $('msg').className = 'msg ok';
  $('msg').textContent = 'Đang kiểm tra mã…';
  try { master = await unlock(code); } catch (e) { master = null; }
  $('go').disabled = false;
  if (!master) {
    $('msg').className = 'msg';
    $('msg').textContent = 'Mã không đúng hoặc không còn hiệu lực. Vui lòng liên hệ Phòng HCNS.';
    const f = $('code').parentElement;
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    store.del(STORE);
    return;
  }
  if (remember) store.set(STORE, code);
  $('msg').textContent = '';
  startApp();
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = normalize($('code').value);
  if (code) tryCode(code, true);
});
$('prev').onclick = $('mprev').onclick = () => go(cur - 1, 'back');
$('next').onclick = $('mnext').onclick = () => go(cur + 1, 'in');
$('menu').onclick = openMenu;
$('closeMenu').onclick = () => $('overlay').classList.add('hidden');
$('zoom').onclick = () => $('zoom').classList.add('hidden');
$('logout').onclick = () => { store.del(STORE); location.hash = ''; location.reload(); };
$('dl').onclick = async () => {
  $('dl').disabled = true;
  toast('Đang chuẩn bị file PDF…');
  const data = await fetchPlain('so-tay.bin');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/pdf' }));
  a.download = 'So tay hoi nhap - Quang Nhung.pdf';
  a.click();
  $('dl').disabled = false;
};

document.addEventListener('keydown', (e) => {
  if ($('app').classList.contains('hidden')) return;
  if (e.key === 'Escape') { $('overlay').classList.add('hidden'); $('zoom').classList.add('hidden'); }
  if (!$('overlay').classList.contains('hidden') || !$('zoom').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') go(cur + 1, 'in');
  if (e.key === 'ArrowLeft') go(cur - 1, 'back');
});

// Vuốt ngang trên điện thoại để chuyển trang
let tx = null, ty = null;
$('stage').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('stage').addEventListener('touchend', (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1), dx < 0 ? 'in' : 'back');
  tx = ty = null;
});

const saved = store.get(STORE);
if (saved) tryCode(saved, false);
</script>
</body>
</html>
